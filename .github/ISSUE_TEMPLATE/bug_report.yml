name: Bug 报告
description: 报告可复现的输入、候选、安装或设置问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要上传真实输入内容、个人词库、用户数据库、密钥或未经脱敏的日志。
  - type: input
    id: version
    attributes:
      label: ZIME 版本
      placeholder: 例如 0.1.0 或 commit SHA
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 与硬件
      placeholder: 例如 macOS 15.6，Apple M2
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: 出现问题的应用
      placeholder: 例如 Safari 18.6
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 输入模式
      options:
        - ZIME 简体中文
        - ZIME 繁體中文
        - 智能英文
        - 安装或设置
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用不包含隐私信息的最小示例。
      placeholder: |
        1. 打开……
        2. 输入……
        3. 按下……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附经过脱敏的日志、截图和相关设置。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我确认附件中不含个人输入数据、词库、密钥或其他敏感信息。
          required: true
