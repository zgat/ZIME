name: 功能建议
description: 建议新的输入体验、词库能力或设置选项
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请说明当前体验和实际使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述期望的输入、候选或设置行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私边界
      options:
        - label: 该建议可以完全本地实现。
        - label: 该建议可能涉及联网，我已说明会发送的数据和触发方式。
