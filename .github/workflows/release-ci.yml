name: ZIME release verification
"on":
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag or commit to build and verify (does not publish)
        type: string
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: zime-release-verification
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'zgat/ZIME'
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: ./.github/actions/restore-locked-build-cache
        with:
          save: false
      - run: scripts/install_ci_build_tools.sh quality
      - run: tests/verify_release_automation.sh && tests/verify_publication_owner.sh
      - run: ./action-install.sh
      - run: scripts/run_swiftlint.sh
      - run: tests/verify_development.sh core
      - run: make --no-print-directory release
      - run: tests/verify_development.sh app
      - run: tests/verify_visible_settings_fixture.sh --ui-test
      - run: scripts/run_periphery.sh
      - name: Build and inspect the exact unsigned preview delivery
        run: make --no-print-directory archive ARCHIVE_OUTPUT_DIR="$RUNNER_TEMP/zime-delivery"
      - name: Retain verified candidate for manual review, never publish automatically
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zime-verified-candidate
          path: ${{ runner.temp }}/zime-delivery/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Retain Settings evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zime-release-settings-evidence
          path: build/settings-ui-results/
          retention-days: 3
