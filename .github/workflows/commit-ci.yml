name: ZIME manual validation
"on":
  workflow_dispatch:
    inputs:
      profile:
        description: Full validation or focused Settings diagnosis
        type: choice
        default: full
        options: [full, theme-preview, settings-ui]
      ui_test:
        description: Optional comma-separated Settings test methods
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: zime-manual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product:
    if: inputs.profile == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: ./.github/actions/restore-locked-build-cache
        with:
          save: true
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: build/swift-unit-cache
          key: zime-swift-units-v2-${{ matrix.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: zime-swift-units-v2-${{ matrix.os }}-${{ runner.arch }}-
      - run: scripts/install_ci_build_tools.sh quality
      - run: scripts/run_swiftlint.sh
      - run: tests/verify_release_automation.sh && tests/verify_publication_owner.sh
      - name: Check language-data release identity changes
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          baseline="${BASE_SHA:-HEAD^}"
          if git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            git diff --name-only "${baseline}" HEAD | package/data_release_metadata check-source-change
            previous="$(mktemp)"
            trap 'rm -f "$previous"' EXIT
            if git show "${baseline}:config/linnet-data-releases.json" > "$previous" 2>/dev/null; then
              package/data_release_metadata check-monotonic "$previous" config/linnet-data-releases.json
            fi
          fi
      - run: ./action-install.sh
      - run: make --no-print-directory release
      - run: tests/verify_development.sh app
      - run: tests/verify_development.sh core
      - run: tests/verify_visible_settings_fixture.sh --ui-test
      - run: tests/verify_zime_coverage.sh
      - run: scripts/run_periphery.sh
      - name: Retain scoped evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zime-evidence-${{ matrix.os }}
          path: |
            build/settings-ui-results/
            build/zime-coverage/run.*/report.txt
            build/zime-coverage/run.*/summary.json
            build/zime-coverage/run.*/html/
          retention-days: 3
  focused:
    if: inputs.profile != 'full'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: ./.github/actions/restore-locked-build-cache
        with:
          save: false
      - run: scripts/install_ci_build_tools.sh release
      - name: Run the requested isolated UI checks
        env:
          PROFILE: ${{ inputs.profile }}
          UI_TEST: ${{ inputs.ui_test }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            theme-preview) tests/verify_swift_units.sh --appearance-preview ;;
            settings-ui)
              ./action-install.sh
              make --no-print-directory release
              tests/verify_visible_settings_fixture.sh --ui-test "$UI_TEST" ;;
            *) exit 64 ;;
          esac
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zime-focused-settings-evidence
          path: build/settings-ui-results/
          retention-days: 3
